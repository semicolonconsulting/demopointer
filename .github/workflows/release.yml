name: Release

# Push a tag like v1.0.0 to build a notarized DMG and attach it to a GitHub Release.
# The DMG window layout needs Finder scripting, which CI runners may not allow; then the DMG gets
# Finder's default layout (see scripts/make-dmg.sh).
# Required repository secrets (see docs/RELEASING.md):
#   APPLE_TEAM_ID
#   DEVELOPER_ID_CERT_P12        base64 of the "Developer ID Application" certificate + key (.p12)
#   DEVELOPER_ID_CERT_PASSWORD   password of that .p12
#   ASC_KEY_ID, ASC_ISSUER_ID    App Store Connect API key used for notarization
#   ASC_KEY_P8                   contents of the AuthKey_XXXX.p8 file

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select the newest Xcode
        # The app icon is an Icon Composer .icon, which needs Xcode 26 or later.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build, sign and notarize
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          VERSION="${GITHUB_REF_NAME#v}" ./scripts/release-github.sh

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/release/DemoPointer-*.dmg --title "Demo Pointer ${GITHUB_REF_NAME#v}" --generate-notes
