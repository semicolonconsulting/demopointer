name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        # The app icon is an Icon Composer .icon, which needs Xcode 26 or later on macOS 26.
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Build app bundle (ad-hoc signed)
        run: ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent DemoPointer.app DemoPointer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DemoPointer
          path: build/DemoPointer.zip
