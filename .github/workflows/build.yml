name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app bundle
        run: ./scripts/build-app.sh
      - name: Zip app
        run: cd build && ditto -c -k --keepParent DemoPointer.app DemoPointer.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DemoPointer
          path: build/DemoPointer.zip
